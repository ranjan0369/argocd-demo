---
cloudProvider: vps
repo: docker-registry-service.dev.fs.identv.com/k8s-juicer/
imageTag: latest
imagePullPolicy: Always
certsecretName: ca-key-pair
installKeel: true
domain: juicer.internal
ingressTLS: true

services: {}
  ## Functional Services

  api:
    typeDeployment: true
    resources: {}
    imageSource: sith-api
    replicaCount: 1
    command: ["bash", "-c", "update-ca-certificates --fresh && npm run setup && yarn start"]
    deploymentAnnotations: {}
    podAnnotations:
      co.elastic.logs/enabled: false
    livenessProbe:
      httpGet:
        path: /status
        port: 10010
      initialDelaySeconds: 5
      periodSeconds: 8
    # volumes:
    #   api:
    #     secretName: api
    #     mountPath: /usr/src/app/.env
    #     subPath: .env
    servicePort:
      service: 10010
    service:
      enabled: true
      serviceType: ClusterIP
      serviceAnnotations: {}
      ports:
      - name: http
        protocol: TCP
        port: 10010
        targetPort: 10010
    ingress:
      servicePort: 10010
      enabled: false
      annotations:
        # nginx.ingress.kubernetes.io/ssl-redirect: "false"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
        nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
        cert-manager.io/issuer: "letsencrypt-prod"
        nginx.ingress.kubernetes.io/enable-cors: "true"
        kubernetes.io/ingress.class: "nginx"
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,content-type,sessiontoken"
      path: /
      host: api

  juicer-ui:
    typeDeployment: true
    resources: {}
    imageSource: juicer-web-ui
    replicaCount: 1
    command: ["bash", "-c", "update-ca-certificates --fresh && npm start"]
    deploymentAnnotations: {}
    podAnnotations:
      co.elastic.logs/enabled: false
    # volumes:
    #   juicer-ui:
    #     secretName: juicer-ui
    #     mountPath: /usr/src/app/.env
    #     subPath: .env
    servicePort:
      service: 3000
    service:
      enabled: true
      serviceType: ClusterIP
      serviceAnnotations: {}
      ports:
      - name: http
        protocol: TCP
        port: 3000
        targetPort: 3000
    ingress:
      servicePort: 3000
      enabled: false
      annotations:
        nginx.ingress.kubernetes.io/enable-cors: "true"
        kubernetes.io/ingress.class: "nginx"
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
        cert-manager.io/issuer: "letsencrypt-prod"
        acme.cert-manager.io/http01-edit-in-place: "true"
        nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,content-type,sessiontoken"
      path: /
      host: juicer
        
