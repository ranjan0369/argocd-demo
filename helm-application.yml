apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: juicer-apps
  namespace: default
spec:
  project: default
  source:
    repoURL: https://github.com/ranjan0369/argocd-demo.git
    targetRevision: HEAD
    path: base/juicer
    helm:
      valueFiles:
      - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true